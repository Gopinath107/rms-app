<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{headline}}</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;color:#222;font-family:Segoe UI,Roboto,Arial,sans-serif;line-height:1.65;">
  <table width="100%" border="0" cellspacing="0" cellpadding="0" role="presentation">
    <tr>
      <td align="center" style="padding:42px 16px;">
        <table width="680" border="0" cellspacing="0" cellpadding="0" role="presentation" style="width:680px;max-width:100%;">
          <!-- Top accent -->
          <tr><td style="height:6px;background:#0b3d75;"></td></tr>

          <!-- Heading -->
          <tr>
            <td style="padding:28px 0 8px 0;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td width="6" style="background:#0b3d75;"></td>
                  <td style="padding:0 0 0 18px;">
                    <div style="letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:#6c7a89;">Interview</div>
                    <div style="font-size:22px;color:#0b3d75;font-weight:700;line-height:1.25;margin-top:4px;">{{headline}}</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Intro -->
          <tr>
            <td style="padding:8px 24px 0 24px;font-size:15px;">
              <p style="margin:0 0 14px 0;">Dear <span style="color:#0b3d75;font-weight:600;">{{employeeName}}</span>,</p>
              <p style="margin:0 0 14px 0;">{{intro}}</p>
            </td>
          </tr>

          <!-- Facts -->
          <tr>
            <td style="padding:6px 24px 8px 24px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin:6px 0 6px 0;">
                <tr>
                  <td style="padding:6px 0;width:160px;color:#6b7280;font-size:12px;text-transform:uppercase;letter-spacing:.06em;">Date</td>
                  <td style="padding:6px 0;font-size:15px;font-weight:600;color:#0b3d75;">{{interviewDateOnly}}</td>
                </tr>
                <tr>
                  <td style="padding:6px 0;color:#6b7280;font-size:12px;text-transform:uppercase;letter-spacing:.06em;">Time</td>
                  <td style="padding:6px 0;font-size:15px;font-weight:600;color:#0b3d75;">{{interviewTimeOnly}}</td>
                </tr>
                <tr>
                  <td style="padding:6px 0;color:#6b7280;font-size:12px;text-transform:uppercase;letter-spacing:.06em;">Account</td>
                  <td style="padding:6px 0;font-size:15px;">{{accountName}}</td>
                </tr>
                <tr>
                  <td style="padding:6px 0;color:#6b7280;font-size:12px;text-transform:uppercase;letter-spacing:.06em;">Project</td>
                  <td style="padding:6px 0;font-size:15px;">{{projectName}}</td>
                </tr>
                <tr>
                  <td style="padding:6px 0;color:#6b7280;font-size:12px;text-transform:uppercase;letter-spacing:.06em;">Interview Type</td>
                  <td style="padding:6px 0;font-size:15px;">{{interviewType}}</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Note -->
          <tr>
            <td style="padding:8px 24px 0 24px;font-size:15px;">
              <p style="margin:0 0 14px 0;">{{note}}</p>
              <p style="margin:22px 0 0 0;">Regards,<br><strong>Rudhra Info Solutions Recruitment</strong></p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:26px 0 0 0;">
              <table width="100%" role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr><td style="height:1px;background:#e7edf5;"></td></tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:22px 8px 10px 8px;">
              <img src="cid:companyLogo" alt="RIS Logo" style="width:110px;height:auto;display:block;margin:0 auto 6px auto;">
              <div style="font-size:13px;color:#6b7280;"><strong>{{companyName}}</strong></div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
