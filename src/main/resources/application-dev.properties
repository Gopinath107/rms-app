spring.application.name=rms-app

server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resource?currentSchema=rms}
spring.datasource.username=${DB_USERNAME:rms}
spring.datasource.password=${DB_PASSWORD:rms}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.initialization-mode=always

spring.datasource.hikari.connection-init-sql=SET search_path TO rms


spring.mail.host=smtp.zoho.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.pool=true
spring.mail.properties.mail.smtp.pool.size=4
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.mail.properties.mail.smtp.quitwait=false
# Optional: avoid partial success reports
spring.mail.properties.mail.smtp.reportsuccess=false

storage.provider=${STORAGE_PROVIDER:D:/Resource_Management_RIS_Application/fileslocation}

storage.default.provider=${STORAGE_DEFAULT_PROVIDER:aws}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
aws.region=${AWS_REGION:eu-north-1}
aws.s3.bucket=${AWS_S3_BUCKET:rms-resume-bucket}
aws.s3.base-url=${AWS_S3_BASE_URL:https://rms-resume-bucket.s3.eu-north-1.amazonaws.com}
aws.s3.enforce-sse=true
aws.access.key=${AWS_ACCESS_KEY_ID:}
aws.secret.key=${AWS_SECRET_ACCESS_KEY:}


